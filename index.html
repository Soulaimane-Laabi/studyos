        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatRelativeTime(ts) {
            if (!ts) return 'Just now';
            const diffSec = Math.floor((Date.now() - ts) / 1000);
            if (diffSec < 60) return 'Just now';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
            const d = new Date(ts);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        async function sha256Hex(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(`studyos_salt_v1::${text}`);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ==========================================
        // 2. USER-SCOPED INDEXEDDB STORAGE
        //    - studyos_vault_{uid}: Private binary PDFs & images
        //    - studyos_private_{uid}: Private security settings & Device-Only data
        // ==========================================
        function openScopedIDB(dbName, storeNames) {
            return new Promise((resolve) => {
                if (!window.indexedDB) {
                    resolve(null);
                    return;
                }
                const req = indexedDB.open(dbName, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    storeNames.forEach((name) => {
                        if (!db.objectStoreNames.contains(name)) {
                            db.createObjectStore(name);
                        }
                    });
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        // Scoped Binary Vault: studyos_vault_{uid}
        async function saveVaultBinary(uid, fileId, dataUrl) {
            const idb = await openScopedIDB(`studyos_vault_${uid}`, ['files']);
            if (!idb) return false;
            return new Promise((resolve) => {
                const tx = idb.transaction('files', 'readwrite');
                tx.objectStore('files').put(dataUrl, fileId);
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        }

        async function getVaultBinary(uid, fileId) {
            const idb = await openScopedIDB(`studyos_vault_${uid}`, ['files']);
            if (!idb) return null;
            return new Promise((resolve) => {
                const tx = idb.transaction('files', 'readonly');
                const req = tx.objectStore('files').get(fileId);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        async function deleteVaultBinary(uid, fileId) {
            const idb = await openScopedIDB(`studyos_vault_${uid}`, ['files']);
            if (!idb) return;
            const tx = idb.transaction('files', 'readwrite');
            tx.objectStore('files').delete(fileId);
        }

        async function clearScopedVaultIDB(uid) {
            const idb = await openScopedIDB(`studyos_vault_${uid}`, ['files']);
            if (!idb) return;
            const tx = idb.transaction('files', 'readwrite');
            tx.objectStore('files').clear();
        }

                        content: `## Segmentation Logique (Niveau 2)
• Un VLAN isole les domaines de broadcast au niveau liaison de données (OSI Layer 2).
• Les ports **Access** appartiennent à un seul VLAN (trames non taguées).
• Les ports **Trunk** transportent plusieurs VLANs entre switches en insérant un tag de **4 octets (IEEE 802.1Q)** contenant le VID (12 bits → 4094 VLANs utilisables).

[[formula: Hôtes utilisables par sous-réseau = 2^(32 - CIDR) - 2]]

\`\`\`ios
Switch(config)# vlan 10
Switch(config-vlan)# name ETUDIANTS
Switch(config)# interface GigabitEthernet0/1
Switch(config-if)# switchport mode trunk
Switch(config-if)# switchport trunk allowed vlan 10,20,99
\`\`\`

[[trick: Le Native VLAN (VLAN 1 par défaut) circule sans tag sur un lien trunk 802.1Q. Toujours vérifier la correspondance du Native VLAN des deux côtés pour éviter les erreurs CDP/VLAN mismatch !]]`

• Utiliser le **Wildcard Mask** (inverse du masque de sous-réseau : \`255.255.255.255 - Mask\`).
• L'élection du Router-ID suit l'ordre : commande \`router-id\` > plus haute IP Loopback > plus haute IP interface physique active.

\`\`\`ios
Router(config)# router ospf 1
Router(config-router)# router-id 1.1.1.1
Router(config-router)# network 192.168.10.0 0.0.0.255 area 0
Router# show ip ospf neighbor
Router# show ip route ospf
\`\`\`

[[trick: Si deux routeurs restent bloqués en état INIT ou EXSTART, vérifiez le masque de sous-réseau, les timers Hello/Dead (10s/40s en Ethernet) et le MTU des interfaces.]]`

• Toujours activer \`PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION\` et désactiver l'émulation des requêtes préparées.
• Les paramètres liés (\`:email\`, \`?\`) séparent strictement la structure SQL des données utilisateur.

\`\`\`php
$pdo = new PDO($dsn, $user, $pass, [
    PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
    PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
    PDO::ATTR_EMULATE_PREPARES => false,
]);

$stmt = $pdo->prepare('SELECT id, password_hash FROM users WHERE email = :email');
$stmt->execute(['email' => $email]);
$user = $stmt->fetch();
\`\`\`

[[trick: PDO protège contre l'injection SQL (SQLi), mais PAS contre le XSS ! Utilisez toujours htmlspecialchars($str, ENT_QUOTES, 'UTF-8') à l'affichage HTML.]]`

• Ordonner les colonnes et lignes selon le **Code Gray** (\`00, 01, 11, 10\`) afin qu'une seule variable change entre deux cases adjacentes.
• Former les plus grands rectangles possibles de taille puissance de 2 : **1, 2, 4, 8, 16**.
• Les états indifférents (**Don't Care X**) peuvent être inclus s'ils permettent d'agrandir un groupe, sinon ignorés.

[[trick: N'oubliez pas que le tableau de Karnaugh est torique : le bord gauche est adjacent au bord droit, et le haut est adjacent au bas (les 4 coins forment un groupe de 4 !).]]`

                        content: `## Choix de la Loi & Règle de Décision
• Si l'écart-type de la population σ est connu (ou n ≥ 30), utiliser la loi Normale centrée réduite Z.
• Si σ est inconnu et n < 30 (population gaussienne), utiliser la loi de **Student t_(n-1)**.

[[formula: IC(1 - α) = x̄ ± t_(α/2, n-1) · (s / √n)]]

• **Règle p-value** : Si p-value < α (souvent 0.05), on **rejette H₀** au risque de première espèce α.

        function mapAuthError(err) {
            const code = err?.code || '';
            if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
                return 'Invalid email or password. Please check your credentials.';
            }
            if (code === 'auth/email-already-in-use') {
                return 'An account with this email already exists. Switch to Sign In.';
            }
            if (code === 'auth/weak-password') {
                return 'Password must be at least 6 characters long.';
            }
            if (code === 'auth/invalid-email') {
                return 'Please enter a valid email address.';
            }
            if (code === 'auth/popup-blocked' || code === 'auth/popup-closed-by-user' || code === 'auth/unauthorized-domain') {
                return 'Google popup blocked in this embedded frame. Use Email/Password, Workspace Token, or Private Device-Only Mode.';
            }
            return err?.message || 'Authentication failed. Please try again.';
        }

        async function initFirebaseSubsystem() {
            try {
                if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                    state.firebaseAvailable = false;
                    renderScreenLayers();
                    return;
                }

                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                state.firebaseAvailable = true;
                state.hasCustomToken = typeof __initial_auth_token !== 'undefined' && Boolean(__initial_auth_token);

                // Listen to Firebase Auth state changes — never auto-bypass the Privacy Gate unless already signed in
                onAuthStateChanged(auth, async (fbUser) => {
                    if (fbUser) {
                        await enterPrivateWorkspace({
                            mode: 'firebase',
                            user: {
                                uid: fbUser.uid,
                                email: fbUser.email || (fbUser.isAnonymous ? 'Private Workspace Session' : 'Authenticated Student'),
                                displayName: fbUser.displayName || (fbUser.email ? fbUser.email.split('@')[0] : 'Student'),
                                provider: fbUser.providerData?.[0]?.providerId || (fbUser.isAnonymous ? 'Workspace Token' : 'Firebase Auth')

                        });
                    } else if (state.authMode === 'firebase') {
                        resetInMemoryWorkspace();
                        state.authMode = 'unauthenticated';
                        state.user = null;
                        renderScreenLayers();
                    } else {
                        renderScreenLayers();
                    }
                });

                console.error('Firebase init check:', e);
                state.firebaseAvailable = false;
                renderScreenLayers();
            }

            } else {
                state.pinHash = null;
                state.autoLockOnBlur = true;
            }
            // If user has configured a 4-digit PIN, require PIN on fresh unlock
            state.isLocked = Boolean(state.pinHash);
            state.pinEntryBuffer = '';
            state.pinError = false;

            if (mode === 'device-only') {

                renderScreenLayers();

        // --- Device-Only IndexedDB Persistence (Zero Cloud Upload) ---
        async function loadDeviceOnlyData(uid) {
            const saved = await idbGetMeta(uid, 'workspace_collections');
            if (saved && saved.initialized) {
                state.modules = saved.modules || [];
                state.notes = saved.notes || [];
                state.vaultItems = saved.vaultItems || [];
                state.flashcards = saved.flashcards || [];
                state.tasks = saved.tasks || [];
                state.stats = saved.stats || [];
            } else {
                const starter = getStarterWorkspaceData();
                state.modules = starter.modules;
                state.notes = starter.notes;
                state.vaultItems = starter.vaultItems;
                state.flashcards = starter.flashcards;
                state.tasks = starter.tasks;
                state.stats = starter.stats;
                await persistDeviceOnlyData(uid);
            }
            syncTodaySessionCount();
        }

        async function persistDeviceOnlyData(uid) {
            await idbPutMeta(uid, 'workspace_collections', {
                initialized: true,
                modules: state.modules,
                notes: state.notes,
                vaultItems: state.vaultItems,
                flashcards: state.flashcards,
                tasks: state.tasks,
                stats: state.stats
            });
        }

        // --- Firebase Firestore Strict Per-UID Listeners ---
        function attachFirestoreListeners(uid) {
            if (!db || !uid) return;
            clearAllUnsubscribers();
            const colNames = ['modules', 'notes', 'vaultItems', 'flashcards', 'tasks', 'stats'];
            let initialSnapshotsReceived = new Set();
            let seededTriggered = false;

            colNames.forEach((colName) => {
                // Strict private UID isolation: /artifacts/{appId}/users/{uid}/{colName}
                const colRef = collection(db, 'artifacts', appId, 'users', uid, colName);

                const unsub = onSnapshot(colRef, async (snapshot) => {
                    // Guard against stale snapshots if user signed out
                    if (!state.user || state.user.uid !== uid || state.authMode !== 'firebase') return;

                    const list = [];
                    snapshot.forEach((docSnap) => {
                        list.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    state[colName] = list;

                    if (colName === 'stats') {
                        syncTodaySessionCount();
                    }

                    initialSnapshotsReceived.add(colName);
                    if (initialSnapshotsReceived.size === colNames.length && !seededTriggered) {
                        seededTriggered = true;
                        const alreadyInitialized = await idbGetMeta(uid, 'cloud_seeded_v1');
                        const totalItems = state.modules.length + state.notes.length + state.tasks.length + state.flashcards.length;
                        if (!alreadyInitialized && totalItems === 0) {
                            await idbPutMeta(uid, 'cloud_seeded_v1', true);
                            await seedStarterToFirestore(uid);
                        } else if (totalItems > 0 && !alreadyInitialized) {
                            await idbPutMeta(uid, 'cloud_seeded_v1', true);
                        }
                    }

                    renderAll();
                }, (error) => {
                    console.error(`Firestore sync error on ${colName}:`, error);
                    state.syncStatus = 'Sync Warning';
                    renderHeader();
                });

                activeUnsubscribers.push(unsub);
            });
        }

        async function seedStarterToFirestore(uid) {
            if (!db || !uid) return;
            const starter = getStarterWorkspaceData();
            try {
                for (const colName of Object.keys(starter)) {
                    for (const item of starter[colName]) {
                        const { id, ...payload } = item;
                        await setDoc(doc(db, 'artifacts', appId, 'users', uid, colName, id), payload);
                    }
                }
            } catch (e) {
                console.error('Starter seeding error:', e);
            }
        }

        async function upsertDoc(colName, item) {
            if (!state.user) return null;
            const uid = state.user.uid;
            const id = item.id || `${colName.slice(0, 3)}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
            const record = { ...item, id };

            const idx = state[colName].findIndex(x => x.id === id);
            if (idx >= 0) state[colName][idx] = record;
            else state[colName].push(record);

            renderAll();

            if (state.authMode === 'device-only') {
                await persistDeviceOnlyData(uid);
            } else if (state.authMode === 'firebase' && db && auth?.currentUser) {
                try {
                    const { id: docId, ...payload } = record;
                    await setDoc(doc(db, 'artifacts', appId, 'users', uid, colName, docId), payload);
                } catch (e) {
                    console.error(`Firestore write error on ${colName}:`, e);
                }
            }
            return record;
        }

            if (!state.user) return;
            const uid = state.user.uid;
            state[colName] = state[colName].filter(x => x.id !== id);

            if (state.authMode === 'device-only') {

            }
        }

        function playCompletionChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.16);
                    gain.gain.setValueAtTime(0.0001, now + idx * 0.16);
                    gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.16 + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.16 + 0.85);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.16);
                    osc.stop(now + idx * 0.16 + 0.9);
                });
            } catch (e) {}
        }

        // ==========================================
        // 13. NOTE READER & DISTRACTION-FREE EDITOR
        // ==========================================
        function renderFormattedNoteHtml(rawText) {
            const escaped = escapeHtml(rawText || '');
            const codeBlocks = [];
            let processed = escaped.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
                const idx = codeBlocks.length;
                const cleanCode = code.replace(/\n$/, '');
                codeBlocks.push({ lang: lang || 'code', code: cleanCode });
                return `@@CODEBLOCK_${idx}@@`;
            });

            processed = processed.replace(/\[\[formula:\s*([\s\S]*?)\]\]/gi, (_, expr) => {
                return `<div class="my-3 p-3 rounded-xl bg-sky-500/10 border border-sky-500/25 font-mono text-xs text-sky-300 flex items-center gap-2"><span class="px-1.5 py-0.5 rounded bg-sky-500/20 text-[10px] font-bold uppercase tracking-wider text-sky-300 shrink-0">Formula</span><span>${expr.trim()}</span></div>`;
            });

            processed = processed.replace(/\[\[trick:\s*([\s\S]*?)\]\]/gi, (_, tip) => {
                return `<div class="my-3 p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/25 text-xs text-amber-200/95 leading-relaxed"><div class="flex items-center gap-1.5 font-bold text-amber-400 text-[11px] uppercase tracking-wider mb-1"><span>⚡ Exam Trick</span></div><div>${tip.trim()}</div></div>`;
            });

            processed = processed.replace(/^##\s+(.+)$/gm, '<h3 class="text-sm font-extrabold text-[#F3F4F6] mt-4 mb-1.5 tracking-tight">$1</h3>');
            processed = processed.replace(/^#\s+(.+)$/gm, '<h2 class="text-base font-extrabold text-[#F3F4F6] mt-4 mb-2 tracking-tight">$1</h2>');
            processed = processed.replace(/\*\*(.+?)\*\*/g, '<strong class="font-bold text-[#F3F4F6]">$1</strong>');
            processed = processed.replace(/`([^`\n]+)`/g, '<code class="px-1.5 py-0.5 rounded-md bg-[#1E222B] font-mono text-[11px] text-sky-300">$1</code>');
            processed = processed.replace(/^(?:•|-)\s+(.+)$/gm, '<div class="flex items-start gap-2 my-1 pl-1"><span class="text-indigo-400 font-bold">•</span><span class="flex-1">$1</span></div>');

            processed = processed.replace(/@@CODEBLOCK_(\d+)@@/g, (_, idxStr) => {
                const block = codeBlocks[Number(idxStr)];
                return `
                    <div class="my-3 rounded-xl bg-[#07080A] border border-[#1E222B] overflow-hidden">
                        <div class="px-3 py-1.5 bg-[#111318] border-b border-[#1E222B] flex items-center justify-between">

                        </div>
                        <pre class="p-3 text-[11px] font-mono text-emerald-300/95 overflow-x-auto leading-relaxed"><code>${block.code}</code></pre>
                    </div>
                `;
            });

            return `<div class="text-xs text-[#D1D5DB] leading-relaxed whitespace-pre-line">${processed}</div>`;
        }

                            const start = bodyInput.selectionStart || bodyInput.value.length;
                            const end = bodyInput.selectionEnd || bodyInput.value.length;

            if (!state.user) return;
            const uid = state.user.uid;
            const item = state.vaultItems.find(v => v.id === itemId);
            if (!item) return;

            let dataUrl = state.memoryFileCache[item.id] || item.dataUrl || null;
            if (!dataUrl && item.type === 'file') {
                dataUrl = await getVaultBinary(uid, item.id);
                if (dataUrl) state.memoryFileCache[item.id] = dataUrl;
            }

            let bodyHtml = '';
            if (item.type === 'file') {
                if (dataUrl && item.mimeType?.startsWith('image/')) {
                    bodyHtml = `
                        <div class="rounded-2xl overflow-hidden bg-[#09090B] border border-[#1E222B] flex items-center justify-center max-h-80">
                            <img src="${dataUrl}" alt="${escapeHtml(item.title)}" class="max-h-80 w-auto object-contain" />
                        </div>
                    `;
                } else if (dataUrl && item.mimeType === 'application/pdf') {
                    bodyHtml = `
                        <div class="rounded-2xl overflow-hidden border border-[#1E222B] h-80 bg-[#09090B]">
                            <iframe src="${dataUrl}" class="w-full h-full" title="${escapeHtml(item.title)}"></iframe>
                        </div>
                    `;
                } else if (dataUrl && (item.mimeType?.startsWith('text/') || item.fileName?.match(/\.(txt|md|csv|json|c|cpp|py|php|sql|js|html)$/i))) {
                    let textContent = 'Download file to view contents.';
                    try {
                        const b64 = dataUrl.split(',')[1];
                        if (b64) textContent = atob(b64);
                    } catch (e) {}
                    bodyHtml = `
                        <pre class="p-3.5 rounded-2xl bg-[#09090B] border border-[#1E222B] text-xs font-mono text-emerald-300 max-h-64 overflow-auto whitespace-pre-wrap">${escapeHtml(textContent)}</pre>
                    `;
                } else {
                    bodyHtml = `
                        <div class="p-6 rounded-2xl bg-[#09090B] border border-[#1E222B] text-center space-y-1.5">
                            <i data-lucide="file-lock-2" class="w-8 h-8 mx-auto text-indigo-400 mb-1"></i>
                            <p class="text-xs font-bold text-[#F3F4F6]">${escapeHtml(item.fileName || item.title)}</p>
                            <p class="text-[11px] font-mono text-[#8B92A5]">${item.fileSize ? formatBytes(item.fileSize) : 'Local File'}</p>
                            ${!dataUrl ? `<p class="text-[10px] text-amber-400">Binary file is stored on the original upload device.</p>` : ''}
                        </div>
                    `;
                }
            } else if (item.type === 'link') {
                bodyHtml = `
                    <div class="p-3.5 rounded-2xl bg-[#09090B] border border-[#1E222B]">
                        <p class="text-[10px] font-mono uppercase tracking-wider text-sky-400 mb-1">External URL</p>
                        <p class="text-xs font-mono text-[#F3F4F6] break-all">${escapeHtml(item.url)}</p>
                    </div>
                `;
            } else {
                bodyHtml = `
                    <pre class="p-3.5 rounded-2xl bg-[#09090B] border border-[#1E222B] text-xs font-mono text-emerald-300 max-h-64 overflow-auto whitespace-pre-wrap leading-relaxed">${escapeHtml(item.content)}</pre>
                `;
            }

            openModal(`
                <div class="w-full bg-[#111318] rounded-t-[2rem] sm:rounded-3xl sm:m-4 p-5 pb-safe border-t sm:border border-[#1E222B] shadow-2xl animate-sheet-up max-h-[90dvh] overflow-y-auto">
                    <div class="flex items-start justify-between gap-2 mb-3">
                        <div class="min-w-0">
                            <span class="px-2 py-0.5 rounded-md bg-[#1E222B] text-[10px] font-mono text-sky-400">${escapeHtml(item.tag || item.type)}</span>
                            <h3 class="text-base font-extrabold text-[#F3F4F6] mt-1.5 leading-snug">${escapeHtml(item.title)}</h3>
                        </div>
                        <button onclick="closeModal()" class="p-2 rounded-full bg-[#1E222B] text-[#8B92A5] shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    ${bodyHtml}

                    <div class="flex items-center gap-2 mt-4">
                        <button id="vlt-del-btn" class="p-3 rounded-xl bg-rose-500/15 text-rose-400" title="Delete Resource">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>

                        ${item.type === 'file' && dataUrl ? `
                            <a href="${dataUrl}" download="${escapeHtml(item.fileName || item.title)}" class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition">
                                <i data-lucide="download" class="w-4 h-4"></i> Download File
                            </a>
                        ` : ''}

                        ${item.type === 'link' ? `
                            <button onclick="copyTextSafe('${escapeHtml(item.url)}', 'URL copied')" class="py-3 px-3.5 rounded-xl bg-[#1E222B] text-xs font-bold text-[#F3F4F6]">Copy</button>
                            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition">
                                <i data-lucide="external-link" class="w-4 h-4"></i> Open Resource
                            </a>
                        ` : ''}

                        ${item.type === 'snippet' ? `
                            <button id="vlt-copy-snip-btn" class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition">
                                <i data-lucide="copy" class="w-4 h-4"></i> Copy Snippet
                            </button>
                        ` : ''}
                    </div>
                </div>
            `);

            const copySnipBtn = document.getElementById('vlt-copy-snip-btn');
            if (copySnipBtn) {
                copySnipBtn.onclick = () => copyTextSafe(item.content || '', 'Snippet copied');
            }

            document.getElementById('vlt-del-btn').onclick = () => {
                confirmAction({
                    title: 'Delete Vault Item?',
                    message: `Remove "${item.title}" from this subject?`,
                    onConfirm: async () => {
                        delete state.memoryFileCache[item.id];
                        await deleteVaultBinary(uid, item.id);
                        await deleteDocItem('vaultItems', item.id);
                        showToast('Item removed', 'rose');
                    }
                });
            };
        };

        // ==========================================
        // 15. TAB 2: TASKS (COMPLETELY SEPARATE & ULTRA-SIMPLE)
        // ==========================================
        window.setTaskFilter = function(f) {
            state.taskFilter = f;
            renderAll();
        };

        window.setNewTaskModule = function(modId) {
            state.newTaskModuleId = modId;
        };

        window.handleQuickAddTask = async function(e) {
            e.preventDefault();
            const input = document.getElementById('quick-task-input');
            if (!input) return;
            const title = input.value.trim();
            if (!title) return;

            input.value = '';
            await upsertDoc('tasks', {
                title,
                moduleId: state.newTaskModuleId || 'general',
                completed: false,
                createdAt: Date.now()
            });
            showToast('Task added', 'indigo');
        };

        window.toggleSimpleTask = async function(taskId) {
            const t = state.tasks.find(x => x.id === taskId);
            if (!t) return;
            await upsertDoc('tasks', { ...t, completed: !t.completed });
        };

        window.deleteSimpleTask = async function(taskId) {
            await deleteDocItem('tasks', taskId);
            showToast('Task removed', 'rose');
        };

        window.clearCompletedTasks = async function() {
            const doneTasks = state.tasks.filter(t => t.completed);
            for (const t of doneTasks) {
                await deleteDocItem('tasks', t.id);
            }
            showToast('Cleared completed tasks', 'emerald');
        };

        function renderTasksView() {
            const activeTasks = state.tasks
                .filter(t => !t.completed)
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            const doneTasks = state.tasks
                .filter(t => t.completed)
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            const shownList = state.taskFilter === 'active' ? activeTasks : doneTasks;

            return `
                <form onsubmit="handleQuickAddTask(event)" class="p-3 rounded-2xl bg-[#111318] border border-[#1E222B] space-y-2.5">
                    <div class="flex items-center gap-2">
                        <input
                            id="quick-task-input"
                            type="text"
                            placeholder="Add a task..."
                            autocomplete="off"
                            class="flex-1 bg-transparent text-xs text-[#F3F4F6] placeholder-[#8B92A5] focus:outline-none px-1.5 py-1"
                        />
                        <button type="submit" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shrink-0 active:scale-95 transition">
                            Add
                        </button>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-[#1E222B]/80">
                        <span class="text-[10px] font-mono uppercase tracking-wider text-[#8B92A5]">Tag:</span>
                        <select onchange="setNewTaskModule(this.value)" class="bg-[#09090B] border border-[#1E222B] rounded-lg px-2 py-1 text-[11px] font-semibold text-[#F3F4F6] focus:outline-none">
                            <option value="general" ${state.newTaskModuleId === 'general' ? 'selected' : ''}>General</option>
                            ${state.modules.map(m => `<option value="${m.id}" ${state.newTaskModuleId === m.id ? 'selected' : ''}>${escapeHtml(m.code || m.title)}</option>`).join('')}
                        </select>
                    </div>
                </form>

                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5">
                        <button onclick="setTaskFilter('active')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition tabular-nums ${
                            state.taskFilter === 'active'
                                ? 'bg-[#F3F4F6] text-[#09090B]'
                                : 'bg-[#111318] border border-[#1E222B] text-[#8B92A5] hover:text-[#F3F4F6]'
                        }">Active (${activeTasks.length})</button>

                        <button onclick="setTaskFilter('done')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition tabular-nums ${
                            state.taskFilter === 'done'
                                ? 'bg-[#F3F4F6] text-[#09090B]'
                                : 'bg-[#111318] border border-[#1E222B] text-[#8B92A5] hover:text-[#F3F4F6]'
                        }">Done (${doneTasks.length})</button>
                    </div>

                    ${doneTasks.length > 0 ? `
                        <button onclick="clearCompletedTasks()" class="text-[11px] font-semibold text-[#8B92A5] hover:text-rose-400 transition">
                            Clear completed
                        </button>
                    ` : ''}
                </div>

                ${shownList.length === 0 ? `
                    <div class="py-14 text-center">
                        <p class="text-xs font-bold text-[#8B92A5]">
                            ${state.taskFilter === 'active' ? 'No active tasks — enjoy clear focus.' : 'No completed tasks yet.'}
                        </p>
                    </div>
                ` : `
                    <div class="space-y-2">
                        ${shownList.map(task => {
                            const mod = task.moduleId && task.moduleId !== 'general'
                                ? state.modules.find(m => m.id === task.moduleId)
                                : null;

                            return `
                                <div class="group p-3.5 rounded-2xl bg-[#111318] border border-[#1E222B] flex items-center gap-3 transition">
                                    <button onclick="toggleSimpleTask('${task.id}')" aria-label="Toggle Task" class="w-5 h-5 rounded-lg border flex items-center justify-center shrink-0 transition ${
                                        task.completed
                                            ? 'bg-emerald-500 border-emerald-500 text-[#09090B]'
                                            : 'border-[#2E3442] hover:border-indigo-400 bg-[#09090B]'
                                    }">
                                        ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                                    </button>

                                    <div onclick="toggleSimpleTask('${task.id}')" class="flex-1 min-w-0 cursor-pointer">
                                        <p class="text-xs font-semibold leading-snug ${task.completed ? 'line-through text-[#8B92A5]' : 'text-[#F3F4F6]'}">
                                            ${escapeHtml(task.title)}
                                        </p>
                                        ${mod ? `<span class="inline-block mt-1 px-1.5 py-0.5 rounded bg-[#1E222B] text-[10px] font-mono text-sky-400">${escapeHtml(mod.code || mod.title)}</span>` : ''}
                                    </div>

                                    <button onclick="deleteSimpleTask('${task.id}')" aria-label="Delete Task" class="p-1.5 rounded-lg text-[#8B92A5] hover:text-rose-400 transition shrink-0">
                                        <i data-lucide="x" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `}
            `;
        }

        // ==========================================
        // 16. TAB 3: FOCUS & QUIZ (POMODORO + FLASHCARDS)
        // ==========================================
        let pomoIntervalId = null;

        function stopPomodoroInterval() {
            if (pomoIntervalId) {
                clearInterval(pomoIntervalId);
                pomoIntervalId = null;
            }
            state.pomoRunning = false;
        }

        window.switchFocusSubTab = function(sub) {
            state.focusSubTab = sub;
            renderAll();
        };

        window.setPomodoroMode = function(mode) {
            stopPomodoroInterval();
            state.pomoMode = mode;
            state.pomoRemaining = state.pomoDurations[mode];
            renderAll();
        };

        window.adjustPomodoroMinutes = function(deltaMins) {
            if (state.pomoRunning) return;
            const current = state.pomoDurations[state.pomoMode];
            const updated = Math.max(60, Math.min(90 * 60, current + deltaMins * 60));
            state.pomoDurations[state.pomoMode] = updated;
            state.pomoRemaining = updated;
            renderAll();
        };

        window.updatePomodoroIntention = function(val) {
            state.pomoIntention = val;
        };

        window.togglePomodoroTimer = function() {
            if (state.pomoRunning) {
                stopPomodoroInterval();
                renderAll();
                return;
            }

            state.pomoRunning = true;
            pomoIntervalId = setInterval(async () => {
                if (state.pomoRemaining > 1) {
                    state.pomoRemaining -= 1;
                    updatePomodoroDomFast();
                } else {
                    const completedMode = state.pomoMode;
                    stopPomodoroInterval();
                    state.pomoRemaining = state.pomoDurations[completedMode];
                    playCompletionChime();

                    if (completedMode === 'focus') {
                        state.completedSessionsToday += 1;
                        await upsertDoc('stats', {
                            id: `pom_${getTodayKey()}`,
                            date: getTodayKey(),
                            sessions: state.completedSessionsToday
                        });
                        showToast('Focus session complete!', 'emerald');
                    } else {
                        showToast('Break finished — ready to focus', 'indigo');
                    }
                    renderAll();
                }
            }, 1000);

            renderAll();
        };

        window.resetPomodoroTimer = function() {
            stopPomodoroInterval();
            state.pomoRemaining = state.pomoDurations[state.pomoMode];
            renderAll();
        };

        function formatClock(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updatePomodoroDomFast() {
            const timeEl = document.getElementById('pomo-time-readout');
            const ringEl = document.getElementById('pomo-progress-circle');
            if (timeEl) timeEl.textContent = formatClock(state.pomoRemaining);
            if (ringEl) {
                const total = state.pomoDurations[state.pomoMode] || 1;
                const radius = 88;
                const circumference = 2 * Math.PI * radius;
                const progress = Math.max(0, Math.min(1, state.pomoRemaining / total));
                ringEl.style.strokeDashoffset = String(circumference * (1 - progress));
            }
        }

        // --- Flashcards & Self-Quiz Actions ---
        window.setFcModuleFilter = function(modId) {
            state.fcModuleFilter = modId;
            state.fcIndex = 0;
            state.fcFlipped = false;
            if (state.fcMode === 'quiz') {
                startFlashcardQuiz();
                return;
            }
            renderAll();
        };

        window.flipBrowseCard = function() {
            state.fcFlipped = !state.fcFlipped;
            const inner = document.getElementById('browse-flip-inner');
            if (inner) inner.classList.toggle('is-flipped', state.fcFlipped);
        };

        window.stepBrowseCard = function(delta, deckLen) {
            if (deckLen <= 0) return;
            state.fcFlipped = false;
            state.fcIndex = (state.fcIndex + delta + deckLen) % deckLen;
            renderAll();
        };

        window.startFlashcardQuiz = function(customDeck = null) {
            const baseDeck = customDeck || getFilteredFlashcards();
            if (baseDeck.length === 0) {
                showToast('Add flashcards first to start a quiz', 'amber');
                return;
            }
            const shuffled = [...baseDeck].sort(() => Math.random() - 0.5);
            state.fcMode = 'quiz';
            state.quizDeck = shuffled;
            state.quizIndex = 0;
            state.quizRevealed = false;
            state.quizGotItIds = [];
            state.quizMissedIds = [];
            state.quizFinished = false;
            renderAll();
        };

        window.exitFlashcardQuiz = function() {
            state.fcMode = 'browse';
            state.fcFlipped = false;
            renderAll();
        };

        window.revealQuizCard = function() {
            state.quizRevealed = true;
            renderAll();
        };

        window.gradeQuizCard = function(gotIt) {
            const currentCard = state.quizDeck[state.quizIndex];
            if (!currentCard) return;
            if (gotIt) {
                state.quizGotItIds.push(currentCard.id);
            } else {
                state.quizMissedIds.push(currentCard.id);
            }

            if (state.quizIndex + 1 < state.quizDeck.length) {
                state.quizIndex += 1;
                state.quizRevealed = false;
            } else {
                state.quizFinished = true;
            }
            renderAll();
        };

        window.retryMissedQuizCards = function() {
            const missedDeck = state.flashcards.filter(c => state.quizMissedIds.includes(c.id));
            if (missedDeck.length > 0) {
                startFlashcardQuiz(missedDeck);
            }
        };

        window.deleteFlashcardItem = function(cardId) {
            confirmAction({
                title: 'Delete Flashcard?',
                message: 'Remove this card from your study deck?',
                onConfirm: async () => {
                    await deleteDocItem('flashcards', cardId);
                    state.fcIndex = 0;
                    state.fcFlipped = false;
                    showToast('Flashcard deleted', 'rose');
                }
            });
        };

        window.openFlashcardCreatorModal = function({ moduleId = null, prefillFront = '', prefillBack = '' } = {}) {
            const defaultMod = moduleId || (state.fcModuleFilter !== 'all' ? state.fcModuleFilter : (state.modules[0]?.id || 'mod_net'));

            openModal(`
                <div class="w-full bg-[#111318] rounded-t-[2rem] sm:rounded-3xl sm:m-4 p-5 pb-safe border-t sm:border border-[#1E222B] shadow-2xl animate-sheet-up">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base font-extrabold text-[#F3F4F6]">New Study Flashcard</h3>
                        <button onclick="closeModal()" class="p-2 rounded-full bg-[#1E222B] text-[#8B92A5]"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    <form id="fc-creator-form" class="space-y-3.5">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-[#8B92A5] mb-1">Subject / Module</label>
                            <select id="fc-mod-select" class="w-full px-3.5 py-2.5 rounded-xl bg-[#09090B] border border-[#1E222B] text-xs text-[#F3F4F6]">
                                ${state.modules.map(m => `<option value="${m.id}" ${m.id === defaultMod ? 'selected' : ''}>${escapeHtml(m.code || '')} — ${escapeHtml(m.title)}</option>`).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-[#8B92A5] mb-1">Front (Question / Concept)</label>
                            <textarea id="fc-front-input" rows="2" required placeholder="e.g., Quelle est la complexité temporelle du tri rapide en moyenne ?" class="w-full px-3.5 py-2.5 rounded-xl bg-[#09090B] border border-[#1E222B] text-xs text-[#F3F4F6] focus:outline-none focus:border-indigo-500">${escapeHtml(prefillFront)}</textarea>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-[#8B92A5] mb-1">Back (Answer / Formula / Command)</label>
                            <textarea id="fc-back-input" rows="3" required placeholder="e.g., O(n log n) en moyenne, O(n²) dans le pire cas." class="w-full px-3.5 py-2.5 rounded-xl bg-[#09090B] border border-[#1E222B] text-xs font-mono text-sky-300 focus:outline-none focus:border-indigo-500">${escapeHtml(prefillBack)}</textarea>
                        </div>

                        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">Save Flashcard</button>
                    </form>
                </div>
            `);

            document.getElementById('fc-creator-form').onsubmit = async (e) => {
                e.preventDefault();
                const selectedMod = document.getElementById('fc-mod-select').value;
                const front = document.getElementById('fc-front-input').value.trim();
                const back = document.getElementById('fc-back-input').value.trim();
                if (!front || !back) return;
                closeModal();
                await upsertDoc('flashcards', {
                    moduleId: selectedMod,
                    front,
                    back
                });
                showToast('Flashcard added to deck', 'emerald');
            };
        };

        function getFilteredFlashcards() {
            if (state.fcModuleFilter === 'all') return state.flashcards;
            return state.flashcards.filter(c => c.moduleId === state.fcModuleFilter);
        }

        function renderFocusAndQuizView() {
            let html = `
                <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-[#111318] border border-[#1E222B]">
                    <button onclick="switchFocusSubTab('pomodoro')" class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                        state.focusSubTab === 'pomodoro'
                            ? 'bg-indigo-600 text-white shadow-xs'
                            : 'text-[#8B92A5] hover:text-[#F3F4F6]'
                    }">
                        <i data-lucide="timer" class="w-3.5 h-3.5"></i>
                        <span>Pomodoro Timer</span>
                    </button>

                    <button onclick="switchFocusSubTab('flashcards')" class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                        state.focusSubTab === 'flashcards'
                            ? 'bg-indigo-600 text-white shadow-xs'
                            : 'text-[#8B92A5] hover:text-[#F3F4F6]'
                    }">
                        <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                        <span>Flashcards (${state.flashcards.length})</span>
                    </button>
                </div>
            `;

            if (state.focusSubTab === 'pomodoro') {
                const total = state.pomoDurations[state.pomoMode] || 1;
                const radius = 88;
                const circumference = 2 * Math.PI * radius;
                const progress = Math.max(0, Math.min(1, state.pomoRemaining / total));
                const dashOffset = circumference * (1 - progress);
                const ringColor = state.pomoMode === 'focus' ? '#6366F1' : '#38BDF8';

                html += `
                    <div class="p-5 rounded-3xl bg-[#111318] border border-[#1E222B] space-y-5">
                        <div class="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-[#09090B] border border-[#1E222B]">
                            ${[
                                { id: 'focus', label: 'Focus 25m' },
                                { id: 'short', label: 'Short 5m' },
                                { id: 'long', label: 'Long 15m' }
                            ].map(m => `
                                <button onclick="setPomodoroMode('${m.id}')" class="py-1.5 rounded-lg text-[11px] font-bold transition ${
                                    state.pomoMode === m.id
                                        ? 'bg-[#1E222B] text-[#F3F4F6]'
                                        : 'text-[#8B92A5] hover:text-[#F3F4F6]'
                                }">${m.label}</button>
                            `).join('')}
                        </div>

                        <div class="relative w-52 h-52 mx-auto flex items-center justify-center">
                            <svg class="w-full h-full -rotate-90" viewBox="0 0 200 200">
                                <circle cx="100" cy="100" r="${radius}" stroke="#1E222B" stroke-width="8" fill="none" />
                                <circle
                                    id="pomo-progress-circle"
                                    cx="100"
                                    cy="100"
                                    r="${radius}"
                                    stroke="${ringColor}"
                                    stroke-width="8"
                                    stroke-linecap="round"
                                    fill="none"
                                    stroke-dasharray="${circumference}"
                                    stroke-dashoffset="${dashOffset}"
                                    style="transition: stroke-dashoffset 0.35s linear;"
                                />
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-[10px] font-mono uppercase tracking-widest text-[#8B92A5]">
                                    ${state.pomoMode === 'focus' ? 'Deep Focus' : 'Recovery Break'}
                                </span>
                                <span id="pomo-time-readout" class="text-4xl font-mono font-extrabold text-[#F3F4F6] tabular-nums mt-1">
                                    ${formatClock(state.pomoRemaining)}
                                </span>
                                <div class="flex items-center gap-2 mt-2">
                                    <button onclick="adjustPomodoroMinutes(-5)" ${state.pomoRunning ? 'disabled' : ''} class="px-2 py-0.5 rounded bg-[#09090B] border border-[#1E222B] text-[10px] font-mono text-[#8B92A5] hover:text-[#F3F4F6] disabled:opacity-40">-5m</button>
                                    <button onclick="adjustPomodoroMinutes(5)" ${state.pomoRunning ? 'disabled' : ''} class="px-2 py-0.5 rounded bg-[#09090B] border border-[#1E222B] text-[10px] font-mono text-[#8B92A5] hover:text-[#F3F4F6] disabled:opacity-40">+5m</button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <input
                                type="text"
                                value="${escapeHtml(state.pomoIntention)}"
                                oninput="updatePomodoroIntention(this.value)"
                                placeholder="Current focus goal (e.g., Réviser chapitre VLAN)..."
                                class="w-full px-3.5 py-2.5 rounded-xl bg-[#09090B] border border-[#1E222B] text-xs text-center text-[#F3F4F6] placeholder-[#8B92A5] focus:outline-none focus:border-indigo-500"
                            />
                        </div>

                        <div class="flex items-center gap-2.5">
                            <button onclick="togglePomodoroTimer()" class="flex-1 py-3 rounded-2xl ${state.pomoRunning ? 'bg-amber-500 text-[#09090B]' : 'bg-indigo-600 hover:bg-indigo-500 text-white'} text-xs font-extrabold flex items-center justify-center gap-1.5 transition active:scale-95">
                                <i data-lucide="${state.pomoRunning ? 'pause' : 'play'}" class="w-4 h-4"></i>
                                <span>${state.pomoRunning ? 'Pause' : 'Start Focus'}</span>
                            </button>
                            <button onclick="resetPomodoroTimer()" aria-label="Reset Timer" class="p-3 rounded-2xl bg-[#09090B] border border-[#1E222B] text-[#8B92A5] hover:text-[#F3F4F6] active:scale-95 transition">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl bg-[#111318] border border-[#1E222B] flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                <i data-lucide="flame" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-[#F3F4F6]">Today's Completed Sessions</p>
                                <p class="text-[10px] text-[#8B92A5]">25-minute deep study blocks</p>
                            </div>
                        </div>
                        <span class="text-lg font-mono font-extrabold text-emerald-400 tabular-nums">${state.completedSessionsToday}</span>
                    </div>
                `;
            } else {
                const deck = getFilteredFlashcards();

                html += `
                    <div class="flex items-center justify-between gap-2">
                        <select onchange="setFcModuleFilter(this.value)" class="flex-1 px-3 py-2 rounded-xl bg-[#111318] border border-[#1E222B] text-xs font-semibold text-[#F3F4F6] focus:outline-none">
                            <option value="all" ${state.fcModuleFilter === 'all' ? 'selected' : ''}>All Modules (${state.flashcards.length})</option>
                            ${state.modules.map(m => {
                                const cnt = state.flashcards.filter(c => c.moduleId === m.id).length;
                                return `<option value="${m.id}" ${state.fcModuleFilter === m.id ? 'selected' : ''}>${escapeHtml(m.code || '')} — ${escapeHtml(m.title)} (${cnt})</option>`;
                            }).join('')}
                        </select>

                        <button onclick="openFlashcardCreatorModal()" class="px-3 py-2 rounded-xl bg-[#111318] border border-[#1E222B] hover:border-indigo-500/40 text-xs font-bold text-[#F3F4F6] flex items-center gap-1 shrink-0">
                            <i data-lucide="plus" class="w-3.5 h-3.5 text-indigo-400"></i> Card
                        </button>
                    </div>
                `;

                if (state.fcMode === 'quiz') {
                    if (state.quizFinished) {
                        const totalQ = state.quizDeck.length;
                        const gotCount = state.quizGotItIds.length;
                        const missedCount = state.quizMissedIds.length;
                        const pct = totalQ > 0 ? Math.round((gotCount / totalQ) * 100) : 0;

                        html += `
                            <div class="p-6 rounded-3xl bg-[#111318] border border-[#1E222B] text-center space-y-4">
                                <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
                                    <i data-lucide="award" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h3 class="text-base font-extrabold text-[#F3F4F6]">Self-Quiz Complete</h3>
                                    <p class="text-xs text-[#8B92A5] mt-1">Active Recall Score: <strong class="text-emerald-400 font-mono">${gotCount}/${totalQ} (${pct}%)</strong></p>
                                </div>

                                <div class="grid grid-cols-2 gap-2.5 pt-2">
                                    ${missedCount > 0 ? `
                                        <button onclick="retryMissedQuizCards()" class="py-3 px-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-bold">
                                            Retry Missed (${missedCount})
                                        </button>
                                    ` : `
                                        <button onclick="startFlashcardQuiz()" class="py-3 px-3 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                                            Quiz Again
                                        </button>
                                    `}
                                    <button onclick="exitFlashcardQuiz()" class="py-3 px-3 rounded-xl bg-[#1E222B] text-xs font-bold text-[#F3F4F6]">
                                        Back to Deck
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        const qCard = state.quizDeck[state.quizIndex];
                        const qMod = state.modules.find(m => m.id === qCard?.moduleId);

                        html += `
                            <div class="space-y-3">
                                <div class="flex items-center justify-between text-xs">
                                    <span class="font-mono text-[#8B92A5] tabular-nums">Question ${state.quizIndex + 1} / ${state.quizDeck.length}</span>
                                    <button onclick="exitFlashcardQuiz()" class="text-[#8B92A5] hover:text-[#F3F4F6] font-semibold">Exit Quiz</button>
                                </div>

                                <div class="p-5 rounded-3xl bg-[#111318] border border-[#1E222B] min-h-[250px] flex flex-col justify-between space-y-4">
                                    <div>
                                        <span class="px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-400 text-[10px] font-mono font-bold">${escapeHtml(qMod?.code || 'CARD')}</span>
                                        <h4 class="text-sm font-extrabold text-[#F3F4F6] mt-3 leading-relaxed">${escapeHtml(qCard?.front || '')}</h4>
                                    </div>

                                    ${state.quizRevealed ? `
                                        <div class="pt-3 border-t border-[#1E222B] space-y-4">
                                            <p class="text-xs font-mono text-sky-300 whitespace-pre-line leading-relaxed">${escapeHtml(qCard?.back || '')}</p>
                                            <div class="grid grid-cols-2 gap-2.5">
                                                <button onclick="gradeQuizCard(false)" class="py-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-bold active:scale-95 transition">
                                                    Needs Review
                                                </button>
                                                <button onclick="gradeQuizCard(true)" class="py-3 rounded-xl bg-emerald-600 text-white text-xs font-bold active:scale-95 transition">
                                                    Got It
                                                </button>
                                            </div>
                                        </div>
                                    ` : `
                                        <button onclick="revealQuizCard()" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition active:scale-95">
                                            Reveal Answer
                                        </button>
                                    `}
                                </div>
                            </div>
                        `;
                    }
                } else {
                    if (deck.length === 0) {
                        html += `
                            <div class="p-6 rounded-3xl bg-[#111318] border border-dashed border-[#1E222B] text-center">
                                <p class="text-xs font-bold text-[#F3F4F6]">No flashcards in this filter</p>
                                <p class="text-[11px] text-[#8B92A5] mt-1">Tap "+ Card" above or "+ Card" inside any note to create flashcards.</p>
                            </div>
                        `;
                    } else {
                        const safeIdx = state.fcIndex % deck.length;
                        const card = deck[safeIdx];
                        const cMod = state.modules.find(m => m.id === card.moduleId);

                        html += `
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-mono text-[#8B92A5] tabular-nums">Card ${safeIdx + 1} of ${deck.length}</span>
                                <button onclick="startFlashcardQuiz()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1.5 active:scale-95 transition">
                                    <i data-lucide="zap" class="w-3.5 h-3.5"></i> Start Self-Quiz
                                </button>
                            </div>

                            <div onclick="flipBrowseCard()" class="perspective-1000 h-64 cursor-pointer select-none">
                                <div id="browse-flip-inner" class="flip-card-inner ${state.fcFlipped ? 'is-flipped' : ''}">
                                    <div class="flip-card-face p-5 rounded-3xl bg-[#111318] border border-[#1E222B] flex flex-col justify-between">
                                        <div class="flex items-center justify-between">
                                            <span class="px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-400 text-[10px] font-mono font-bold">${escapeHtml(cMod?.code || 'MOD')}</span>
                                            <button onclick="event.stopPropagation(); deleteFlashcardItem('${card.id}')" class="p-1 text-[#8B92A5] hover:text-rose-400" title="Delete Card">
                                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                        <p class="text-sm font-extrabold text-[#F3F4F6] text-center leading-relaxed my-auto px-2">${escapeHtml(card.front)}</p>
                                        <p class="text-[10px] font-mono text-center text-[#8B92A5]">Tap card to flip</p>
                                    </div>

                                    <div class="flip-card-face flip-card-back p-5 rounded-3xl bg-[#161922] border border-indigo-500/35 flex flex-col justify-between">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] font-mono uppercase tracking-wider text-sky-400 font-bold">Answer</span>
                                            <span class="text-[10px] font-mono text-[#8B92A5]">Tap to flip back</span>
                                        </div>
                                        <p class="text-xs font-mono text-[#F3F4F6] whitespace-pre-line leading-relaxed my-auto overflow-y-auto obsidian-scroll max-h-40">${escapeHtml(card.back)}</p>
                                        <div></div>
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-2.5">
                                <button onclick="stepBrowseCard(-1, ${deck.length})" class="py-2.5 rounded-xl bg-[#111318] border border-[#1E222B] hover:border-indigo-500/40 text-xs font-bold text-[#F3F4F6] flex items-center justify-center gap-1 active:scale-95 transition">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Previous
                                </button>
                                <button onclick="stepBrowseCard(1, ${deck.length})" class="py-2.5 rounded-xl bg-[#111318] border border-[#1E222B] hover:border-indigo-500/40 text-xs font-bold text-[#F3F4F6] flex items-center justify-center gap-1 active:scale-95 transition">
                                    Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        `;
                    }
                }
            }

            return html;
        }

        // ==========================================
        // 17. BOOTSTRAP APPLICATION ON PRIVACY GATE
        // ==========================================
        renderScreenLayers();
        initFirebaseSubsystem();
    </script>
</body>
</html>
